<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8dff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1060" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#shine)"/>
  <!-- A page laid out on the grid: a wide header block, a tall block and two small ones. -->
  <g filter="url(#shadow)" fill="#fff">
    <rect x="232" y="232" width="560" height="160" rx="44"/>
    <rect x="232" y="432" width="260" height="360" rx="44" fill-opacity="0.92"/>
    <rect x="532" y="432" width="260" height="160" rx="44" fill-opacity="0.8"/>
    <rect x="532" y="632" width="260" height="160" rx="44" fill="#ffd36e"/>
  </g>
</svg>
